{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillForge AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-blue-100 text-gray-800 min-h-screen flex flex-col font-sans">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
       <div class="w-full px-8 h-16 flex items-center justify-between">

            <a href="{% url 'home' %}" class="flex items-center gap-2 text-brand-600 font-semibold text-lg tracking-tight">
                🎓 SkillForge <span class="text-gray-400 font-normal">AI</span>
            </a>

            <div class="flex items-center gap-1">
                {% if request.user.is_authenticated %}
                    <a href="{% url 'home' %}" class="px-3 py-1.5 text-sm text-gray-600 hover:text-brand-600 hover:bg-brand-50 rounded-md transition-colors">Home</a>
                    <a href="{% url 'dashboard' %}" class="px-3 py-1.5 text-sm text-gray-600 hover:text-brand-600 hover:bg-brand-50 rounded-md transition-colors">Dashboard</a>
                    <a href="{% url 'interviews' %}" class="px-3 py-1.5 text-sm text-gray-600 hover:text-brand-600 hover:bg-brand-50 rounded-md transition-colors">Interviews</a>
                    <a href="{% url 'chatbot' %}" class="px-3 py-1.5 text-sm text-gray-600 hover:text-brand-600 hover:bg-brand-50 rounded-md transition-colors">AI Assistant</a>
                    <a href="{% url 'resume-upload' %}" class="px-3 py-1.5 text-sm text-gray-600 hover:text-brand-600 hover:bg-brand-50 rounded-md transition-colors">Resume AI</a>
                    <div class="w-px h-4 bg-gray-200 mx-2"></div>
                    <span class="text-sm text-gray-500">Welcome, {{ request.user.username }}</span>
                    <a href="{% url 'logout' %}" class="ml-2 px-3 py-1.5 text-sm font-medium text-white bg-gray-800 hover:bg-gray-700 rounded-md transition-colors">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="px-3 py-1.5 text-sm text-gray-600 hover:text-brand-600 hover:bg-brand-50 rounded-md transition-colors">Login</a>
                    <a href="{% url 'register' %}" class="ml-1 px-4 py-1.5 text-sm text-white bg-brand-500 hover:bg-brand-600 rounded-md transition-colors font-medium">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="flex-1 overflow-x-hidden px-8 py-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="border-t border-gray-200 bg-white mt-auto">
        <div class="max-w-7xl mx-auto px-8 h-12 flex items-center justify-between">
            <span class="text-xs text-gray-400">© 2025 SkillForge AI</span>
            <span class="text-xs text-gray-400">Built to help you grow</span>
        </div>
    </footer>

</body>
</html>
