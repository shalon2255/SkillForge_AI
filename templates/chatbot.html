{% extends 'base.html' %}

{% block content %}

<div class="max-w-5xl mx-auto h-[85vh] flex flex-col">

    <!-- Header -->

    <div class="bg-white shadow rounded-t-2xl p-6">

        <h1 class="text-3xl font-bold">
            SkillForge AI Assistant
        </h1>

    </div>


    <!-- Chat Area -->

    <div class="flex-1 bg-gray-100 p-6 overflow-y-auto space-y-6">

        {% for chat in chat_history %}

            <!-- User Message -->

            <div class="flex justify-end">

                <div class="bg-black text-white p-4 rounded-2xl max-w-xl">

                    {{ chat.user }}

                </div>

            </div>


            <!-- AI Response -->

            <div class="flex justify-start">

   <div class="bg-white p-4 rounded-2xl shadow max-w-3xl">
    <pre class="whitespace-pre-wrap break-words font-sans text-sm leading-7 [word-break:break-word] [overflow-wrap:anywhere]">
{{ chat.bot }}
    </pre>
</div>

                </div>

            </div>

        {% endfor %}

    </div>


    <!-- Input Box -->

    <div class="bg-white p-4 rounded-b-2xl shadow">

        <form method="POST" class="flex gap-4">

            {% csrf_token %}

            <input
                type="text"
                name="message"
                placeholder="Ask anything..."
                class="flex-1 border rounded-xl px-4 py-3 outline-none">

            <button
                class="bg-black text-white px-6 py-3 rounded-xl">

                Send

            </button>

        </form>

    </div>

</div>

{% endblock %}
